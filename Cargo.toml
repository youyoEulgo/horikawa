[workspace]
resolver = "2"
members = [
    "crates/horikawa-core",
    "crates/horikawa-protocol",
    "crates/horikawa-ctl",
    "crates/horikawa-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["youyoEulgo"]

[workspace.dependencies]
# Audio
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rubato = "0.16"

# Async
tokio = { version = "1", features = ["full"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Utilities
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde_json = "1.0"

# Internal
horikawa-core = { path = "crates/horikawa-core", version = "0.1.0" }
horikawa-protocol = { path = "crates/horikawa-protocol", version = "0.1.0" }
horikawa-ctl = { path = "crates/horikawa-ctl", version = "0.1.0" }
